services:
  mailpit:
    image: axllent/mailpit:v1.29
    container_name: mailpit
    restart: unless-stopped
    volumes:
      - mail-data:/data
    ports:
      - 8025:8025
      - 1025:1025
    networks:
      - mailpit
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1


networks:
  mailpit:

volumes:
  mail-data:
