[project]
name = "job-portal"
version = "0.1.0"
requires-python = "==3.13.13"
classifiers = ["Private :: Do not Upload"]
dependencies = [
  "django[argon2]>=6.0.4,<6.1",
  "django-split-settings>=1.3,<2.0",
  "django-cors-headers>=4.0,<5.0",
  "django-stubs-ext>=6.0,<7.0",
  "django-modern-rest[msgspec,pydantic,attrs,jwt,openapi]>=0.6,<1.0",

  "python-decouple>=3.8,<4.0",
  "structlog>=25.4,<26.0",
  "punq>=0.7,<1.0",
]

[dependency-groups]
dev = [
  # Django stuff
  "django-debug-toolbar>=6.0,<7.0",
  "ruff>=0.15.11,<1.0",
  "django-stubs[compatible-mypy]>=6.0.2,<6.1",
  "ipython>=9.5,<10.0",
  "pyrefly>=0.62.0,<1.0",
]

[tool.uv]
# Docs: https://docs.astral.sh/uv/reference/settings
package = false
