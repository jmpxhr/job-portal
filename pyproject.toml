[project]
name = "job-portal"
version = "0.1.0"
requires-python = "==3.13.13"
classifiers = ["Private :: Do not Upload"]
readme = "README.md"
dependencies = [
  "django[argon2]>=6.0.4,<6.1",
  "django-split-settings>=1.3,<2.0",
  "django-cors-headers>=4.0,<5.0",
  "django-stubs-ext>=6.0,<7.0",
  "django-tasks-db>=0.12.0",
  "django-filter>=25.2",
  "django-enum>=2.4.2",
  "django-htmx>=1.27.0",
  "pillow>=12.2.0",
  "python-decouple>=3.8,<4.0",
  "structlog>=25.4,<26.0",
  "djangorestframework>=3.17.1",
  "weasyprint>=68.1",
  "channels[daphne,types]>=4.3.2",
]

[dependency-groups]
dev = [
  # Django stuff
  "django-debug-toolbar>=6.0,<7.0",
  "django-zeal>=2.1.0",
  "django-query-counter>=0.5.0",
  "django-stubs[compatible-mypy]>=6.0.2,<6.1",
  "types-punq>=0.7.0.20260408",
  "ipython>=9.5,<10.0",
  "ruff>=0.15.11,<1.0",
  "pyrefly>=0.62.0,<1.0",
  "djlint>=1.36.4",
  "types-django-filter>=25.2.0.20260408",
  "djangorestframework-stubs[compatible-mypy]>=3.16.9",
]

[tool.uv]
# Docs: https://docs.astral.sh/uv/reference/settings
package = false

[tool.ruff]
# Ruff config: https://docs.astral.sh/ruff/settings
preview = true
fix = true
target-version = "py313"
line-length = 80
extend-exclude = ["**/migrations/*.py"]

[tool.ruff.format]
quote-style = "single"
docstring-code-format = true

[tool.ruff.lint]
select = [
  "A",     # flake8-builtins
  "ASYNC",
  "B",     # flake8-bugbear
  "C4",    # flake8-comprehensions
  "C90",   # maccabe
  "COM",   # flake8-commas
  "DTZ",   # flake8-datetimez
  "E",     # pycodestyle
  "ERA",   # flake8-eradicate
  "EXE",   # flake8-executable
  "F",     # pyflakes
  "FA",    # flake8-future-annotations
  "FBT",   # flake8-boolean-trap
  "FLY",   # pyflint
  "FURB",  # refurb
  "G",     # flake8-logging-format
  "I",     # isort
  "ICN",   # flake8-import-conventions
  "ISC",   # flake8-implicit-str-concat
  "LOG",   # flake8-logging
  "N",     # pep8-naming
  "PERF",  # perflint
  "PIE",   # flake8-pie
  "PL",    # pylint
  "PT",    # flake8-pytest-style
  "PTH",   # flake8-use-pathlib
  "Q",     # flake8-quotes
  "RET",   # flake8-return
  "RSE",   # flake8-raise
  "RUF",   # ruff
  "S",     # flake8-bandit
  "SIM",   # flake8-simpify
  "SLF",   # flake8-self
  "SLOT",  # flake8-slots
  "T100",  # flake8-debugger
  "TRY",   # tryceratops
  "UP",    # pyupgrade
  "W",     # pycodestyle
  "YTT",   # flake8-2020
]
ignore = [
  "A005",    # allow to shadow stdlib and builtin module names
  "ISC001",  # implicit string concat conflicts with `ruff format`
  "ISC003",  # prefer explicit string concat over implicit concat
  "PLR09",   # we have our own complexity rules
  "PLR2004", # do not report magic numbers
  "PLR6301", # do not require classmethod / staticmethod when self not used
  "RUF067",  # wps handles `__init__.py` logic better
  "TRY003",  # long exception messages from `tryceratops`
  "ERA001",  # Found commented-out code,
  "RUF012",  # Mutable default value for class attribute
  "S101",    # Use of `assert` detected
]

# Plugin configs:
flake8-quotes.inline-quotes = "single"
mccabe.max-complexity = 6
pydocstyle.convention = "google"

[tool.ruff.lint.per-file-ignores]
"apps/*/migrations/*.py" = ["D101", "E501", "RUF012"]

[tool.pyrefly]
project-includes = ["server/**/*.py"]

[tool.mypy]
# Mypy configuration:
# https://mypy.readthedocs.io/en/latest/config_file.html
enable_error_code = [
  "truthy-bool",
  "truthy-iterable",
  "redundant-expr",
  "unused-awaitable",
  "ignore-without-code",
  "possibly-undefined",
  "redundant-self",
  "explicit-override",
  "unimported-reveal",
  "deprecated",
  "exhaustive-match",
]

explicit_package_bases = true
ignore_missing_imports = true
local_partial_types = true
strict = true
strict_bytes = true
warn_unreachable = true

plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]

[[tool.mypy.overrides]]
module = "server.apps.*.migrations.*"
# Django migrations should not produce any errors (they are tested anyway):
ignore_errors = true

[tool.django-stubs]
# Docs: https://github.com/typeddjango/django-stubs
django_settings_module = "server.settings"
strict_settings = false

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true

[tool.djlint]
profile = "django"
ignore = "T002,H030,H021,H031,H006,H005,H023"
