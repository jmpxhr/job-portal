services:
  db:
    image: "postgres:18-alpine"
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - postgres-net
    env_file: ./config/.env
    healthcheck:
      test: pg_isready
      interval: 5s
      timeout: 30s
      retries: 5
      start_period: 5s

  web:
    <<:
      # Image name is changed in production:
      &web
      image: "server:dev"
      build:
        target: development_build
        context: .
        dockerfile: ./docker/django/Dockerfile
        args:
          DJANGO_ENV: development
        cache_from:
          - "server:dev"
      init: true
      volumes:
        - django-static:/var/www/django/static
      depends_on:
        db:
          condition: service_healthy
      networks:
        - web-net
        - postgres-net
      env_file: ./config/.env
      environment:
        DJANGO_DATABASE_HOST: db

    command: python manage.py runserver 0.0.0.0:8000

  django_tasks_db_worker:
    <<: *web
    command: python manage.py db_worker
    restart: on-failure

networks:
  postgres-net:
  web-net:

volumes:
  postgres-data:
  django-static:
