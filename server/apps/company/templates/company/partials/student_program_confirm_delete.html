{% load i18n %}
<div class="info-card mt-4">
  <h5 class="section-title">{% translate "Delete Program" %}</h5>
  <p>
    {% blocktranslate with title=program.title %}Are you sure you want to delete <strong>"{{ title }}"</strong>?{% endblocktranslate %}
  </p>
  <p class="text-muted small">{% translate "This action cannot be undone." %}</p>
  <form hx-post="{% url 'company:student-program-delete' company.pk program.pk %}"
        hx-target="#student-programs-content"
        hx-swap="innerHTML">
    {% csrf_token %}
    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-danger">
        <i class="bi bi-trash"></i> {% translate "Delete" %}
      </button>
      <button type="button"
              class="btn btn-outline-secondary"
              hx-get="{% url 'company:student-program-create' company.pk %}"
              hx-target="#student-programs-content"
              hx-swap="innerHTML"
              hx-on="click: null">{% translate "Cancel" %}</button>
    </div>
  </form>
</div>
