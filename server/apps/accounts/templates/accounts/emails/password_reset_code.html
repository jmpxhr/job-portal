<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Your Password - StartJob</title>
  </head>
  <body style="margin: 0;
               padding: 0;
               background-color: #f4f4f7;
               font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <table width="100%"
           cellpadding="0"
           cellspacing="0"
           style="background-color: #f4f4f7;
                  padding: 40px 0">
      <tr>
        <td align="center">
          <table width="500"
                 cellpadding="0"
                 cellspacing="0"
                 style="background-color: #ffffff;
                        border-radius: 16px;
                        box-shadow: 0 4px 24px rgba(0,0,0,0.08);
                        overflow: hidden">
            <!-- Header -->
            <tr>
              <td style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                         padding: 30px;
                         text-align: center">
                <h1 style="color: #ffffff; margin: 0; font-size: 24px;">StartJob</h1>
              </td>
            </tr>
            <!-- Body -->
            <tr>
              <td style="padding: 40px 30px; text-align: center;">
                <h2 style="color: #333333; margin: 0 0 16px; font-size: 20px;">Reset Your Password</h2>
                <p style="color: #666666;
                          margin: 0 0 24px;
                          font-size: 15px;
                          line-height: 1.6">
                  Hello {{ user.first_name }},
                  <br />
                  You requested to reset your password. Please use the following code to proceed:
                </p>
                <div style="background: #f0f4ff;
                            border-radius: 12px;
                            padding: 20px;
                            margin: 0 auto 24px;
                            max-width: 280px">
                  <span style="font-size: 32px;
                               font-weight: bold;
                               letter-spacing: 8px;
                               color: #667eea">{{ verification_code }}</span>
                </div>
                <p style="color: #999999; margin: 0; font-size: 13px;">
                  This code expires in 10 minutes. If you did not request a password reset, please ignore this email.
                </p>
              </td>
            </tr>
            <!-- Footer -->
            <tr>
              <td style="padding: 20px 30px;
                         text-align: center;
                         border-top: 1px solid #eeeeee">
                <p style="color: #999999; margin: 0; font-size: 12px;">StartJob. All rights reserved.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
