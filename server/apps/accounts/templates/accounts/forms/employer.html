<!-- Progress Steps -->
<div class="progress-steps">
  <div class="step">
    <div class="step-number">2</div>
    <small>Personal Info</small>
  </div>
</div>

<div id="step2" style="display: none;">
  <form id="registrationForm">
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label">First Name</label>
        <input type="text" class="form-control" placeholder="Anna" />
      </div>
      <div class="col-md-6">
        <label class="form-label">Last Name</label>
        <input type="text" class="form-control" placeholder="Petrova" />
      </div>
      <div class="col-12">
        <label class="form-label">Email Address</label>
        <input type="email" class="form-control" placeholder="anna@student.com" />
      </div>
    </div>

    <div class="row g-3 mt-3">
      <div class="col-md-6">
        <label class="form-label">Company Name</label>
        <input type="text" class="form-control" placeholder="TechStart Inc." />
      </div>
      <div class="col-md-6">
        <label class="form-label">Company Email</label>
        <input type="email" class="form-control" placeholder="hr@techstart.com" />
      </div>
      <div class="col-md-6">
        <label class="form-label">Industry</label>
        <select class="form-select">
          <option>Technology</option>
          <option>Marketing</option>
          <option>Finance</option>
          <option>Healthcare</option>
        </select>
      </div>
      <div class="col-md-6">
        <label class="form-label">Company Size</label>
        <select class="form-select">
          <option>1-50 employees</option>
          <option>51-200 employees</option>
          <option>201-500 employees</option>
          <option>500+ employees</option>
        </select>
      </div>
      <div class="col-12">
        <label class="form-label">Website (optional)</label>
        <input type="url" class="form-control" placeholder="https://www.company.com" />
      </div>
    </div>

    <div class="mt-3">
      <label class="form-label">Password</label>
      <input type="password" class="form-control" placeholder="Create password" />
      <div class="password-strength bg-danger" style="width: 30%;"></div>
      <small class="text-muted">Password strength: Weak</small>
    </div>

    <div class="mt-3">
      <label class="form-label">Confirm Password</label>
      <input type="password" class="form-control" placeholder="Confirm password" />
    </div>

    <div class="d-flex gap-2 mt-4">
      <button type="button" class="btn btn-outline-secondary w-50"><i class="bi bi-arrow-left me-2"></i>Back</button>
      <button type="button" class="btn-register w-50">Continue <i class="bi bi-arrow-right ms-2"></i></button>
    </div>
  </form>
</div>
