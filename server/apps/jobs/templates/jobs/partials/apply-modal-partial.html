{% load i18n %}
<div class="modal fade"
     id="applyModal"
     tabindex="-1"
     aria-labelledby="applyModalLabel"
     aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="applyModalLabel">
          {% blocktranslate with title=job.title %}Apply for {{ title }}{% endblocktranslate %}
        </h5>
        <button type="button"
                class="btn-close"
                data-bs-dismiss="modal"
                aria-label="{% translate 'Close' %}"></button>
      </div>
      <div id="apply-modal-body">{% include "jobs/partials/apply-form-partial.html" %}</div>
    </div>
  </div>
</div>
