{% load i18n %}
<div class="modal-body text-center py-4">
  <i class="bi bi-check-circle text-success" style="font-size: 3rem;"></i>
  <h5 class="mt-3 fw-bold">{% translate "Application Submitted!" %}</h5>
  <p class="text-muted">
    {% blocktranslate with title=job.title %}Your application for {{ title }} has been sent.{% endblocktranslate %}
  </p>
</div>
<div class="modal-footer">
  <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">{% translate "Close" %}</button>
</div>
<button id="apply-button-container"
        class="btn btn-success btn-lg flex-grow-1"
        disabled
        hx-swap-oob="true">
  <i class="bi bi-check-circle me-2"></i>{% translate "Already Applied" %}
</button>
