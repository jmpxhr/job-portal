{% load static %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <h4 class="fw-bold mb-0">Languages</h4>
  <button class="btn btn-outline-primary btn-sm"
          hx-get="{% url 'dashboard:language-create' %}"
          hx-target="#language-content"
          hx-swap="innerHTML">
    <i class="bi bi-plus-lg"></i> Add Language
  </button>
</div>
{% for lang in language_entries %}
  <div class="language-item">
    <div class="d-flex justify-content-between">
      <h5 class="fw-bold mb-2">{{ lang.name }}</h5>
      <div class="d-flex gap-1">
        <button class="btn btn-sm btn-outline-secondary"
                hx-get="{% url 'dashboard:language-update' lang.pk %}"
                hx-target="#language-content"
                hx-swap="innerHTML">
          <i class="bi bi-pencil"></i>
        </button>
        <button class="btn btn-sm btn-outline-danger"
                hx-delete="{% url 'dashboard:language-delete' lang.pk %}"
                hx-target="#language-content"
                hx-swap="innerHTML"
                hx-confirm="Are you sure you want to delete this language entry?">
          <i class="bi bi-trash"></i>
        </button>
      </div>
    </div>
    <p class="text-muted mb-0">{{ lang.get_proficiency_label }}</p>
  </div>
{% empty %}
  <div class="text-center py-4">
    <i class="bi bi-translate fs-1 text-muted"></i>
    <h5 class="mt-3 text-muted">No languages added yet</h5>
    <p class="text-muted">Add languages you speak</p>
  </div>
{% endfor %}
