{% load static %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <h4 class="fw-bold mb-0">Skills</h4>
  <button class="btn btn-outline-primary btn-sm"
          hx-get="{% url 'dashboard:skill-add' %}"
          hx-target="#skills-content"
          hx-swap="innerHTML">
    <i class="bi bi-plus-lg"></i> Add Skill
  </button>
</div>
{% if skills %}
  <div class="d-flex flex-wrap gap-2 mb-3">
    {% for skill in skills %}
      <div class="skill-badge d-inline-flex align-items-center">
        {{ skill.name }}
        <button class="btn btn-sm p-0 ms-1"
                hx-delete="{% url 'dashboard:skill-remove' skill.pk %}"
                hx-target="#skills-content"
                hx-swap="innerHTML"
                hx-confirm="Remove '{{ skill.name }}' from your skills?">
          <i class="bi bi-x"></i>
        </button>
      </div>
    {% endfor %}
  </div>
{% else %}
  <div class="text-center py-4">
    <i class="bi bi-stars fs-1 text-muted"></i>
    <h5 class="mt-3 text-muted">No skills added yet</h5>
    <p class="text-muted">Add your skills to showcase your expertise</p>
  </div>
{% endif %}
